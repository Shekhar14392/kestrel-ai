<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat — Kestrel AI</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  #active-agent-avatar.speaking .agent-mouth { animation: agent-talk 0.35s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes agent-talk {
    from { transform: scaleY(1); }
    to { transform: scaleY(2.2); }
  }
  #active-agent-avatar { border-radius: 50%; transition: box-shadow 0.3s ease; }
  #active-agent-avatar.emotion-positive { box-shadow: 0 0 0 4px rgba(78, 139, 108, 0.35); }
  #active-agent-avatar.emotion-apologetic { box-shadow: 0 0 0 4px rgba(181, 83, 60, 0.3); }
  #active-agent-avatar.emotion-neutral { box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.25); }
  #voice-interim { min-height: 1.2em; }
</style>
</head>
<body>
<div class="app-shell">
  {% include "_sidebar.html" %}
  <div class="main-area" style="padding:0; display:flex;">
    <div class="chat-layout" style="flex:1;">
      <div class="agent-list">
        {% for key, a in agents.items() %}
        <div class="agent-item {{ 'active' if loop.first }}" data-agent="{{ key }}" onclick="selectAgent('{{ key }}', this)">
          <div class="name">{{ a.name }}</div>
          <div class="role">{{ a.role }}</div>
        </div>
        {% endfor %}
      </div>
      <div class="chat-main">
        <div style="padding:20px 40px 0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div style="display:flex; align-items:center; gap:12px;">
            <div id="active-agent-avatar" style="width:48px; height:48px; display:none;"></div>
            <div><h1 style="font-size:1.3rem;" id="active-agent-name">{{ (agents.values()|list)[0].name }}</h1><span class="muted" id="active-agent-role">{{ (agents.values()|list)[0].role }}</span></div>
          </div>
          {% if voice_active %}
          <div style="display:flex; align-items:center; gap:8px;">
            <select id="voice-lang" style="padding:6px 8px; border:1px solid var(--paper-dim);">
              <option value="en-US">English (US)</option>
              <option value="en-IN">English (India)</option>
              <option value="hi-IN">Hindi</option>
              <option value="te-IN">Telugu</option>
              <option value="ta-IN">Tamil</option>
              <option value="kn-IN">Kannada</option>
              <option value="mr-IN">Marathi</option>
              <option value="bn-IN">Bengali</option>
              <option value="es-ES">Spanish</option>
              <option value="fr-FR">French</option>
              <option value="de-DE">German</option>
              <option value="ar-SA">Arabic</option>
            </select>
            <button class="btn btn-ghost" id="mic-btn" onclick="togglelistening()" title="Voice input">🎙️</button>
          </div>
          {% else %}
          <button class="btn btn-brass" onclick="buyVoiceAddon()">🎙️ Unlock Voice Assistant — ₹{{ "{:,.0f}".format(voice_addon.inr) }}/mo</button>
          {% endif %}
        </div>
        {% if voice_active %}
        <div id="voice-interim" style="display:none; padding:6px 40px 0; color:var(--slate-soft); font-style:italic; font-size:0.9rem;"></div>
        {% endif %}
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const agents = {{ agents|tojson }};
let currentAgent = Object.keys(agents)[0];
const histories = {};

(function initAvatar() {
  const avatarBox = document.getElementById('active-agent-avatar');
  if (agents[currentAgent] && agents[currentAgent].avatar_svg) {
    avatarBox.innerHTML = agents[currentAgent].avatar_svg;
    avatarBox.style.display = 'block';
  }
})();

function selectAgent(key, el) {
  currentAgent = key;
  document.querySelectorAll('.agent-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('active-agent-name').textContent = agents[key].name;
  document.getElementById('active-agent-role').textContent = agents[key].role;
  const avatarBox = document.getElementById('active-agent-avatar');
  if (agents[key].avatar_svg) {
    avatarBox.innerHTML = agents[key].avatar_svg;
    avatarBox.style.display = 'block';
  } else {
    avatarBox.innerHTML = '';
    avatarBox.style.display = 'none';
  }
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById('chat-messages');
  box.innerHTML = '';
  (histories[currentAgent] || []).forEach(m => addBubble(m.role, m.content, false));
}

function addBubble(role, content, scroll = true) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  box.appendChild(div);
  if (scroll) box.scrollTop = box.scrollHeight;
}

async function sendMessage(spokenText) {
  const input = document.getElementById('chat-input');
  const text = spokenText !== undefined ? spokenText : input.value.trim();
  if (!text) return;
  if (spokenText === undefined) input.value = '';

  if (text.startsWith('/')) {
    addBubble('user', text);
    await handleCommand(text.trim());
    return;
  }

  histories[currentAgent] = histories[currentAgent] || [];
  histories[currentAgent].push({ role: 'user', content: text });
  addBubble('user', text);
  addBubble('assistant', 'Thinking…');
  try {
    const res = await fetch('/api/chat/' + currentAgent, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: text }) });
    const data = await res.json();
    document.getElementById('chat-messages').lastChild.remove();
    if (!res.ok) { addBubble('assistant', 'Error: ' + (data.detail || 'something went wrong.')); return; }
    histories[currentAgent].push({ role: 'assistant', content: data.reply });
    addBubble('assistant', data.reply);
    speakReply(data.reply);
  } catch (e) {
    document.getElementById('chat-messages').lastChild.remove();
    addBubble('assistant', 'Network error — please try again.');
  }
}

async function handleCommand(raw) {
  const [cmd, ...rest] = raw.split(' ');
  const arg = rest.join(' ').trim().toLowerCase();

  if (cmd === '/help') {
    addBubble('assistant',
      'Available commands:\n' +
      '/plan — show your current plan, credits, and usage\n' +
      '/agents — list all available agents\n' +
      '/switch <name> — switch to another agent, e.g. /switch ved\n' +
      '/voice — check your voice assistant add-on status\n' +
      '/pages — how many pages you\'ve built with the AI Page Builder\n' +
      '/clear — clear this conversation'
    );
    return;
  }

  if (cmd === '/agents') {
    const list = Object.entries(agents).map(([k, a]) => `${a.name} (${a.role}) — /switch ${k}`).join('\n');
    addBubble('assistant', 'Your 16 agents:\n' + list);
    return;
  }

  if (cmd === '/clear') {
    histories[currentAgent] = [];
    renderHistory();
    return;
  }

  if (cmd === '/switch') {
    if (!arg) { addBubble('assistant', 'Usage: /switch <agent name or key>, e.g. /switch ved'); return; }
    const match = Object.entries(agents).find(([k, a]) => k.toLowerCase() === arg || a.name.toLowerCase() === arg);
    if (!match) { addBubble('assistant', `No agent matches "${arg}". Try /agents to see the list.`); return; }
    const [key] = match;
    const el = document.querySelector(`.agent-item[data-agent="${key}"]`);
    selectAgent(key, el);
    addBubble('assistant', `Switched to ${agents[key].name} — ${agents[key].role}.`);
    return;
  }

  if (cmd === '/plan' || cmd === '/voice' || cmd === '/pages') {
    addBubble('assistant', 'Checking…');
    try {
      const res = await fetch('/api/me');
      const me = await res.json();
      document.getElementById('chat-messages').lastChild.remove();
      if (cmd === '/plan') {
        addBubble('assistant', `Plan: ${me.plan_name}\nCredits remaining: ${me.credits_remaining}${me.is_admin ? ' (admin — unlimited)' : ''}\nWorkflows: ${me.workflow_count} · Pages built: ${me.pages_built}`);
      } else if (cmd === '/voice') {
        addBubble('assistant', me.voice_active ? 'Voice assistant add-on: active ✅' : 'Voice assistant add-on: not active. Look for the "Unlock Voice Assistant" button above to add it.');
      } else if (cmd === '/pages') {
        addBubble('assistant', `You've built ${me.pages_built} page(s) with the AI Page Builder. Visit /page-builder to see them or make a new one.`);
      }
    } catch (e) {
      document.getElementById('chat-messages').lastChild.remove();
      addBubble('assistant', 'Could not fetch your account info right now.');
    }
    return;
  }

  addBubble('assistant', `Unknown command "${cmd}". Type /help to see what's available.`);
}

{% if voice_active %}
// ---- Voice mode: continuous speech-to-text + text-to-speech + emotion-reactive avatar ----
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let continuousMode = false;
let assistantSpeaking = false;

// Neutral mouth path is whatever shipped in the avatar SVG; store it once so we can restore it.
let neutralMouthPath = null;

function togglelistening() {
  if (!SpeechRecognitionAPI) {
    alert('Voice input is not supported in this browser. Try Chrome on desktop or Android.');
    return;
  }
  const micBtn = document.getElementById('mic-btn');
  const interimBox = document.getElementById('voice-interim');

  if (continuousMode) {
    continuousMode = false;
    recognition && recognition.stop();
    micBtn.textContent = '🎙️'; micBtn.title = 'Start continuous voice mode';
    if (interimBox) interimBox.style.display = 'none';
    return;
  }

  continuousMode = true;
  micBtn.textContent = '🔴'; micBtn.title = 'Listening continuously… click to stop';
  if (interimBox) interimBox.style.display = 'block';
  startRecognitionCycle();
}

function startRecognitionCycle() {
  if (!continuousMode || assistantSpeaking) return;
  recognition = new SpeechRecognitionAPI();
  recognition.lang = document.getElementById('voice-lang').value;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        const interimBox = document.getElementById('voice-interim');
        if (interimBox) interimBox.textContent = '';
        sendMessage(transcript);
      } else {
        interim += transcript;
      }
    }
    const interimBox = document.getElementById('voice-interim');
    if (interimBox && interim) interimBox.textContent = '🎙️ ' + interim;
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      continuousMode = false;
      document.getElementById('mic-btn').textContent = '🎙️';
      alert('Microphone access was blocked. Allow it in your browser settings to use voice mode.');
    }
    // 'no-speech' and similar are routine in continuous mode — onend will restart the cycle.
  };

  recognition.onend = () => {
    // Browsers auto-stop SpeechRecognition after a pause even with continuous:true.
    // Restart automatically unless the user turned voice mode off or the assistant is speaking.
    if (continuousMode && !assistantSpeaking) {
      setTimeout(startRecognitionCycle, 250);
    }
  };

  recognition.start();
}

// ---- Lightweight emotion heuristic (not a real classifier — keyword-based, for a visual cue only) ----
function detectEmotion(text) {
  const lower = text.toLowerCase();
  if (/\b(sorry|apologize|unfortunately|can't|cannot|unable|issue|problem)\b/.test(lower)) return 'apologetic';
  if (/\b(great|excellent|happy to|glad|awesome|perfect|congrat)\b/.test(lower) || text.includes('!')) return 'positive';
  return 'neutral';
}

const MOUTH_PATHS = {
  neutral: null, // filled in from the SVG's shipped default on first use
  positive: 'M84 100 Q100 116 116 100',
  apologetic: 'M86 106 Q100 100 114 106',
};

function applyEmotion(emotion) {
  const mouth = document.querySelector('#active-agent-avatar .agent-mouth');
  const avatarBox = document.getElementById('active-agent-avatar');
  if (!mouth || !avatarBox) return;
  if (neutralMouthPath === null) neutralMouthPath = mouth.getAttribute('d');
  mouth.setAttribute('d', MOUTH_PATHS[emotion] || neutralMouthPath);
  avatarBox.classList.remove('emotion-positive', 'emotion-apologetic', 'emotion-neutral');
  avatarBox.classList.add('emotion-' + emotion);
}

function resetEmotion() {
  const mouth = document.querySelector('#active-agent-avatar .agent-mouth');
  const avatarBox = document.getElementById('active-agent-avatar');
  if (mouth && neutralMouthPath !== null) mouth.setAttribute('d', neutralMouthPath);
  if (avatarBox) avatarBox.classList.remove('emotion-positive', 'emotion-apologetic', 'emotion-neutral');
}

function speakReply(text) {
  applyEmotion(detectEmotion(text));
  if (!('speechSynthesis' in window)) return;
  const avatarBox = document.getElementById('active-agent-avatar');
  const lang = document.getElementById('voice-lang').value;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  const voices = speechSynthesis.getVoices();
  const match = voices.find(v => v.lang === lang) || voices.find(v => v.lang.startsWith(lang.split('-')[0]));
  if (match) utter.voice = match;

  assistantSpeaking = true;
  recognition && recognition.stop(); // avoid the mic picking up the assistant's own voice

  utter.onstart = () => avatarBox.classList.add('speaking');
  utter.onend = () => {
    avatarBox.classList.remove('speaking');
    resetEmotion();
    assistantSpeaking = false;
    if (continuousMode) startRecognitionCycle();
  };
  utter.onerror = () => {
    avatarBox.classList.remove('speaking');
    resetEmotion();
    assistantSpeaking = false;
    if (continuousMode) startRecognitionCycle();
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}
{% else %}
function speakReply(text) {} // voice add-on not active

async function buyVoiceAddon() {
  try {
    const res = await fetch('/api/payments/razorpay/create-addon-order', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({addon: 'voice_assistant'})
    });
    const data = await res.json();
    if (!res.ok) { alert(data.detail || 'Could not start checkout.'); return; }
    const rzp = new Razorpay({
      key: data.key_id, amount: data.order.amount, currency: 'INR', name: 'Kestrel AI',
      description: 'Voice Assistant Add-on', order_id: data.order.id,
      handler: async function(response) {
        const v = await fetch('/api/payments/razorpay/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(response) });
        if (v.ok) { window.location.reload(); }
      },
      theme: { color: '#0B2027' }
    });
    rzp.open();
  } catch (e) {
    alert('Network error — please try again.');
  }
}
{% endif %}
</script>
{% if not voice_active %}<script src="https://checkout.razorpay.com/v1/checkout.js"></script>{% endif %}
</body>
</html>
